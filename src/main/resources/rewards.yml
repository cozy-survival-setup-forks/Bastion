# Bastion - rewards.yml
# Chance tables. Each entry is one roll:
#   chance:    percent, 100 = always
#   money:     an amount or [min, max], paid through Vault
#   coins:     an amount or [min, max]. Kept on the player (%dungeon_coins%), or paid with the coins-command in config.yml
#   commands:  console commands, %player% is the player
# Kill rewards go to the player credited with the kill (config.yml: mobs.credit). The tier is the mob's `tier:`.

tiers:
  room1:
    - {chance: 30, coins: [5, 15]}
    - {chance: 10, money: [2, 5]}
  room2:
    - {chance: 45, coins: [10, 30]}
    - {chance: 18, money: [5, 12]}
  guards:
    - {chance: 100, coins: [20, 30]}
    - {chance: 30, money: [10, 25]}
  miniboss:
    - {chance: 100, coins: [60, 90], money: [50, 80]}
    - {chance: 40, commands: []}

# Paid to every player still in the run when the final boss dies.
victory:
  - {chance: 100, money: 5000, coins: 250, commands: []}
