# Bastion - messages.yml
# Every message the plugin sends that is not a line of the story (those are in dialogue.yml).
# Texts take & codes, &#rrggbb and MiniMessage. %name% is filled in by the plugin.
prefix: "&8[&4Bastion&8] &7"

# ---- the run, told to the whole server. The config.yml announcements override these three.
start: "&6⚔ The Buried Throne has opened! &e%participant_count% &6brave souls have entered - wish them luck."
victory: "&6⚔ The Buried Throne has fallen! &e%last_hit_player% &6struck the final blow against &c%boss_name%&6!"
failure: "&7The defenders of The Buried Throne failed to slay &c%boss_name%&7 - it escaped into the dark."
opened: "&6The goal is reached! &eThe Buried Throne is open for &f%minutes% &eminutes. Open the menu with &f/dungeon&e."
nobody-came: "&7Nobody entered The Buried Throne. Funding starts over."
ready: "&7The Buried Throne is ready to be funded again."

# ---- in the run
sealing: "&cThe doors are sealing. There is no more time."
sealing-room: "&7The chamber seals behind you..."
return-warning: "&c⚠ Return to the chamber &7- the others are waiting"
compass: "&7[&6%arrow% %distance%m&7] Something waits to the %direction%..."
locked: "&8The way is sealed."
chamber-silent: "&8The chamber falls silent..."
artifact-found: "&e%player% &7found the &6%artifact%&7!"
chat-prefix: "&8[&4Dungeon&8] &7"
silenced: "&8The dungeon silences you."
keep-out: "&cThe dungeon is in use. You cannot be in there."

# ---- funding and joining
contributed: "&7You put &a%amount% &7towards The Buried Throne."
in-progress: "&cA dungeon is already underway."
no-economy: "&cThere is no economy on this server, so nothing can be contributed."
not-enough: "&cYou cannot afford that."
bad-amount: "&cThat is not an amount."
type-amount: "&7Type the amount to contribute in chat, or &fcancel&7."
cancelled: "&7Cancelled."
not-open: "&cThe dungeon is not open for entry."
already-in: "&cYou are already inside."
no-anchor: "&cThe dungeon has no spawn point yet. An admin needs to set the 'anchor' point."
not-in: "&cYou are not in the dungeon."
no-menu: "&cThe menu is not set up."

# ---- general
no-permission: "&cYou cannot do that."
players-only: "&cOnly players can do that."
reloaded: "&7Reloaded."
usage: "&7/dungeon [menu|status|contribute <amount>|enter|leave]"
status: "&7State &f%state% &8| &7Funding &f%goal% &8| &7Inside &f%players% &8| &7Artifacts &f%artifacts% &8| &7Time &f%time%"
force-started: "&7Started. The dungeon is now &f%state%&7."
force-not-now: "&7Nothing to start: the dungeon is &f%state%&7."
force-ended: "&7Ending the run."
force-reset: "&7Resetting the dungeon."
funded: "&7Funding is now &f%amount%&7."
debug: "&7state &f%state% &8| &7inside &f%inside% &8| &7mobs &f%mobs% &8| &7waves &f%waves% &8| &7bosses &f%bosses% &8| &7tasks &f%tasks% &8| &7regions &f%regions% &8| &7artifacts &f%artifacts% &8| &7reset &f%reset%"

# ---- building tools
wand-given: "&7You have the wand. Left click and right click blocks."
wand-cuboid: "&7Cuboid mode: left click is corner 1, right click is corner 2."
wand-polygon: "&7Polygon mode: right click each corner in order, then sneak and left click to close the shape."
wand-polygon-help: "&7Right click a corner to add it. Sneak and left click to close the shape."
wand-corner: "&7Point &f%number% &7set at &f%position%&7."
wand-few: "&cA shape needs at least 3 corners."
wand-closed: "&7Shape closed with &f%count% &7corners. Save it with /dungeon region save <id> <type>."
usage-region: "&7/dungeon region <save|cuboid|polygon|list|show|delete|setclean>"
usage-region-save: "&7/dungeon region save <id> <type> [minY maxY]  types: %types%"
usage-region-cuboid: "&7/dungeon region cuboid <id> <type> <world> x1 y1 z1 x2 y2 z2"
usage-region-polygon: "&7/dungeon region polygon <id> <type> <world> <minY> <maxY> x,z x,z x,z ..."
no-selection: "&cSelect something with the wand first."
region-saved: "&7Region &f%id% &7saved as &f%type%&7."
region-deleted: "&7Region &f%id% &7deleted."
region-unknown: "&cThere is no such region."
regions-none: "&7No regions yet."
region-line: "&f%id% &8- &7%type% &8- &7%shape% in %world%"
no-dungeon-region: "&cSave a region of type DUNGEON around the whole dungeon first."
reset-busy: "&cThe world is being changed, wait for it to finish."
snapshot-started: "&7Reading the dungeon into dungeon_clean.schem. This takes a moment and does not stop the server."
snapshot-saved: "&7Saved dungeon_clean.schem (&f%blocks% &7blocks). Every run now resets to this."
snapshot-failed: "&cCould not save the snapshot. See the console."
usage-door: "&7/dungeon door <define <id> | cuboid <id> <world> x1 y1 z1 x2 y2 z2 | list | delete <id> | open <id> | close <id>>"
door-defined: "&7Door &f%id% &7saved with &f%blocks% &7gate blocks."
door-list: "&7Doors: &f%doors%"
door-deleted: "&7Door deleted."
door-unknown: "&cThere is no such door."
usage-point: "&7/dungeon point <add|list|remove|clear> <group> [number]   /dungeon chest <add|list|remove|clear>"
point-added: "&7Added to &f%group% &7(now &f%count%&7)."
point-group: "&f%group% &8- &7%count% spots"
point-line: "&f%number% &8- &7%spot%"
point-removed: "&7Removed."
point-cleared: "&7Cleared."
point-unknown: "&cThere is no such group or number."
look-at-chest: "&cLook at the chest or barrel you want to mark."
usage-paste: "&7/dungeon paste <file> [world x y z]"
paste-missing: "&cThe file or the world does not exist."
paste-started: "&7Pasting. This is spread over many ticks and does not stop the server."
paste-done: "&7Pasted: &f%blocks% &7blocks changed in &f%seconds% &7seconds."
paste-failed: "&cCould not read the schematic: %error%"
