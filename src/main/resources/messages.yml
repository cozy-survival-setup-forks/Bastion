# ---------------------------------------------------------------------------------------------------------------
# The story. Every line the dungeon says, by what happened. The dungeon is a character with its own intent, not a
# narrator: short sentences, present tense, no overacting.
#
# tier: NORMAL shows on the action bar and in dungeon chat. MAJOR adds a typed title on top, with title and color.
# lines: one is picked at random each time (pick: sequential goes round in order instead)
# sound: an optional sound, played to whoever sees the line
# delay-ticks: wait this long before showing it
# actionbar-only: true keeps it off the chat
# cooldown-seconds and chance: how often it may fire per player, and the chance it does (for the frequent ones)
# Placeholders: %player%, %boss%, %wave%, %found%, %total%. Everything stays inside the run.
dialogue:
  ON_ENTER_DUNGEON:
    tier: MAJOR
    title: "The Buried Throne"
    color: "#C24141"
    sound: "minecraft:ambient.cave"
    lines:
      - "You shouldn't have come here."
      - "The doors remember every name that has entered."
      - "Something already knows you're here."

  ON_ROOM1_UNLOCK:
    tier: NORMAL
    lines:
      - "Something old stirs behind these shelves."
      - "The dust here hasn't settled in centuries. Until now."

  ON_WAVE_START:
    tier: NORMAL
    lines:
      - "It's not over."
      - "More are coming. They always do."
      - "Did you really think that was all of them?"

  ON_ARTIFACT_FOUND:
    tier: NORMAL
    lines:
      - "One piece returns to the light. (%found%/%total%)"
      - "It didn't want to let that go. (%found%/%total%)"

  ON_ROOM2_UNLOCK:
    tier: NORMAL
    lines:
      - "The altar has been waiting for guests."
      - "Whatever slept in the sanctum is stirring."

  ON_MINIBOSS_SPAWN:
    tier: MAJOR
    title: "The Bloodwoken"
    color: "#FF4D4D"
    sound: "minecraft:entity.evoker.prepare_summon"
    lines:
      - "It rises from where it was laid to rest."
      - "It remembers being alive. It resents you for reminding it."

  ON_ROOM3_UNLOCK:
    tier: NORMAL
    lines:
      - "Nine pieces. One throne. Choose carefully what happens next."

  ON_BOSS_SPAWN:
    tier: MAJOR
    title: "The Buried Sovereign"
    color: "#B87CFF"
    sound: "minecraft:entity.warden.roar"
    lines:
      - "It has waited on that throne far longer than any of you have been alive."
      - "The storm answers to it, not the other way around."

  ON_BOSS_LOW_HP:
    tier: NORMAL
    lines:
      - "It remembers pain now."
      - "Its patience is gone. Yours should be too."

  ON_VICTORY:
    tier: MAJOR
    title: "Victory"
    color: "#F5C542"
    lines:
      - "The throne is empty. For now."
      - "It's over, but thrones like this are never truly vacant for long."

  ON_FAILURE:
    tier: MAJOR
    title: "Defeat"
    color: "#E0E0E0"
    lines:
      - "It slipped back into the dark, laughing."
      - "The dungeon keeps its throne. Try again when the next call for aid is answered."

  # The two frequent ones stay on the action bar, never chat or a title, and only now and then.
  ON_MOB_KILL:
    tier: NORMAL
    actionbar-only: true
    cooldown-seconds: 18
    chance: 35
    lines:
      - "One less thing in the dark."
      - "Not bad."
      - "It won't be the last."
      - "You're learning."

  ON_PLAYER_HURT_BY_MOB:
    tier: NORMAL
    actionbar-only: true
    cooldown-seconds: 18
    chance: 35
    lines:
      - "Careful."
      - "It felt that one land."
      - "You'll want to watch your footing."
      - "It's enjoying this."

  # Shown to everyone except the player who died.
  ON_PLAYER_DEATH:
    tier: MAJOR
    title: "%player% has fallen"
    color: "#C24141"
    lines:
      - "%player% won't be finishing this."
      - "One down. It's still hungry."
      - "%player% is gone. Who's next?"
      - "It only needed one bite to remember how good this feels."

