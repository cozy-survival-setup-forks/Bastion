# Bastion - artifacts.yml
# The nine artifacts to collect. Each is an item with a hidden tag, so it is found again whatever it is renamed to.
#   id:                a short name for the plugin
#   material:          the item
#   name / lore:       what players see. In the lore, %player_found_by%, %find_order% ("3rd") and %total% are filled in
#                      when a player finds it.
#   custom-model-data: optional, for a resource pack
#   consume:           true = taken from inventories when the run is won. false = a keepsake.
# The special artifact is the tenth item, dropped by the final boss. It is not one of the nine: it is the shop currency.
# A DeluxeMenus shop can check for it with the item's custom tag `bastion:shop_currency`.

artifacts:
  - id: whispering_tome
    material: BOOK
    name: "&5Whispering Tome"
    lore:
      - "&7Its pages turn when nobody is reading."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: veiled_candle
    material: CANDLE
    name: "&fVeiled Candle"
    lore:
      - "&7The flame gives no light, only shadow."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: hollow_chalice
    material: GLASS_BOTTLE
    name: "&3Hollow Chalice"
    lore:
      - "&7Always empty. Never dry."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: ashen_seal
    material: FIRE_CHARGE
    name: "&cAshen Seal"
    lore:
      - "&7Warm, like something recently alive."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: bone_key
    material: BONE
    name: "&fBone Key"
    lore:
      - "&7It fits a lock you have not found yet."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: weeping_mask
    material: CARVED_PUMPKIN
    name: "&8Weeping Mask"
    lore:
      - "&7It was never made to be worn."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: gilded_thorn
    material: GOLDEN_SWORD
    name: "&6Gilded Thorn"
    lore:
      - "&7Sharp on every side, including yours."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: sunken_crown
    material: GOLDEN_HELMET
    name: "&eSunken Crown"
    lore:
      - "&7Whoever wore it did not choose to."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false
  - id: last_ember
    material: BLAZE_POWDER
    name: "&6Last Ember"
    lore:
      - "&7The final piece. It is still burning."
      - ""
      - "&8Found by %player_found_by%, %find_order% of %total%"
    consume: false

special:
  id: sovereign_relic
  material: NETHER_STAR
  name: "&5&lSovereign's Relic"
  lore:
    - "&7Proof that you stood before the throne."
    - "&7The dungeon shop takes it as payment."
  consume: false
