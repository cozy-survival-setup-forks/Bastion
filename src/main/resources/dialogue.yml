# Bastion - dialogue.yml
# Every scripted line, keyed by what happened. The dungeon is a character with its own intent, not a narrator:
# short sentences (under about 12 words), present tense, no exclamation-point overacting.
#
# tier: NORMAL shows on the action bar and in dungeon chat. MAJOR adds a title. Only the story beats are MAJOR.
# lines: one is picked at random each time (pick: sequential to go round in order instead)
# sound: an optional sound, played to whoever sees the line
# delay-ticks: wait this long before showing it
# actionbar-only: true keeps it off the chat
# cooldown-seconds / chance: how often it may fire per player, and the chance it does (for the frequent ones)
# Placeholders: %player%, %boss%, %wave%, %found%, %total%. Everything stays inside the run.

chat-prefix: "&8[&4Dungeon&8] &7"

dialogue:
  ON_ENTER_DUNGEON:
    tier: MAJOR
    sound: "minecraft:ambient.cave"
    lines:
      - "&8You shouldn't have come here."
      - "&8The doors remember every name that's entered."
      - "&8Something already knows you're here."

  ON_ROOM1_UNLOCK:
    tier: NORMAL
    lines:
      - "&7Something old stirs behind these shelves."
      - "&7The dust here hasn't settled in centuries - until now."

  ON_WAVE_START:
    tier: NORMAL
    lines:
      - "&7...it's not over."
      - "&7More are coming. They always do."
      - "&7Did you really think that was all of them?"

  ON_ARTIFACT_FOUND:
    tier: NORMAL
    lines:
      - "&7One piece returns to the light. &8(%found%/%total%)"
      - "&7It didn't want to let that go. &8(%found%/%total%)"

  ON_ROOM2_UNLOCK:
    tier: NORMAL
    lines:
      - "&7The altar has been waiting for guests."
      - "&7Whatever slept in the sanctum is stirring."

  ON_MINIBOSS_SPAWN:
    tier: MAJOR
    sound: "minecraft:entity.warden.emerge"
    lines:
      - "&cIt rises from where it was laid to rest."
      - "&cThe Bloodwoken remembers being alive. It resents you for reminding it."

  ON_ROOM3_UNLOCK:
    tier: NORMAL
    lines:
      - "&7Nine pieces. One throne. Choose carefully what happens next."

  ON_BOSS_SPAWN:
    tier: MAJOR
    sound: "minecraft:entity.warden.roar"
    lines:
      - "&5It has waited on that throne far longer than any of you have been alive."
      - "&5The storm answers to it, not the other way around."

  ON_BOSS_LOW_HP:
    tier: NORMAL
    lines:
      - "&5It remembers pain now."
      - "&5Its patience is gone. Yours should be too."

  ON_VICTORY:
    tier: MAJOR
    lines:
      - "&6The throne is empty. For now."
      - "&6It's over - but thrones like this are never truly vacant for long."

  ON_FAILURE:
    tier: MAJOR
    lines:
      - "&8It slipped back into the dark, laughing."
      - "&8The dungeon keeps its throne. Try again when the next call for aid is answered."

  # The two frequent ones: the action bar only, never chat or a title, and rarely, so it reads as an aside.
  ON_MOB_KILL:
    tier: NORMAL
    actionbar-only: true
    cooldown-seconds: 18
    chance: 35
    lines:
      - "&8One less thing in the dark."
      - "&8Not bad."
      - "&8It won't be the last."
      - "&8You're learning."

  ON_PLAYER_HURT_BY_MOB:
    tier: NORMAL
    actionbar-only: true
    cooldown-seconds: 18
    chance: 35
    lines:
      - "&8Careful."
      - "&8It felt that one land."
      - "&8You'll want to watch your footing."
      - "&8It's enjoying this."

  # Shown to everyone except the player who died, as a title beat.
  ON_PLAYER_DEATH:
    tier: MAJOR
    lines:
      - "&4%player% won't be finishing this."
      - "&4One down. It's still hungry."
      - "&4%player% is gone. Who's next?"
      - "&4It only needed one bite to remember how good this feels."
