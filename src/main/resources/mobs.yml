# Bastion mobs.yml
# The mobs, then the bosses. Every mob is a vanilla entity dressed here. Nothing they wear ever drops, and they all
# rise out of the ground.
#
#   type:          any living entity type
#   name:          shown above it (& codes, &#rrggbb or MiniMessage). Bold and bright so it can be read in the dark
#   health:        max health, 0 keeps the vanilla value
#   damage:        attack damage, 0 keeps the vanilla value
#   speed:         movement speed multiplier
#   head / chest / legs / feet / hand / offhand:  item names
#   effects:       potion effects for as long as it lives, as EFFECT:level (0 is level I)
#   tier:          which table in config.yml (rewards) pays out when it dies
#   traits / trait-chance:  one minor power, rolled at spawn with this chance
#       SHOVE     a small knockback on hit, at most every 8 seconds
#       FLICKER   1 to 2 seconds of invisibility when it drops below half health
#       HURL      throws a snowball for a little damage and slowness (for ranged mobs)
#       WAR_CRY   a short weakness pulse on nearby players when it spawns
#       LEAP      jumps at a target that is a few blocks away
#       BLINK     teleports behind its target
#       WITHER_TOUCH / HUNGER_TOUCH / FROST_TOUCH   its hits also wither, starve or slow
#       HEAL_PULSE  heals the mobs around it now and then
#       BLAST     goes off when it dies, a short hard shove and a little damage, nothing broken

