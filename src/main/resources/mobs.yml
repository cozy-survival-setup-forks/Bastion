# Bastion - mobs.yml
# Every mob is a vanilla entity dressed here. Nothing they wear ever drops, and they all rise out of the ground.
#
#   type:          any living entity type
#   name:          shown above it (& codes or MiniMessage)
#   health:        max health, 0 keeps the vanilla value
#   damage:        attack damage, 0 keeps the vanilla value
#   speed:         movement speed multiplier
#   head / chest / legs / feet / hand / offhand:  item names
#   effects:       potion effects for as long as it lives, as EFFECT:level (0 is level I)
#   tier:          which table in rewards.yml pays out when it dies
#   traits / trait-chance:  one minor power, rolled at spawn with this chance. Later rooms use a higher chance.
#       SHOVE     a small knockback on hit, at most every 8 seconds
#       FLICKER   1-2 seconds of invisibility when it drops below half health
#       HURL      throws a snowball for a little damage and slowness (for ranged mobs)
#       WAR_CRY   a short weakness pulse on nearby players when it spawns

